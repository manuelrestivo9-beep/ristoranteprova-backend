<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenota un Tavolo - La Tua Pizzeria (Demo)</title>

    <!-- Microsoft Clarity Code -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y8hjrtwb7z");
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bs-primary: #c17b4e;
            --colore-sfondo: #faf6f1;
            --colore-testo: #2c241f;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--colore-sfondo);
            color: var(--colore-testo);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header-ristorante {
            background: #2c241f;
            color: #faf6f1;
            padding: 40px 20px;
            text-align: center;
        }
        .header-ristorante h1 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 5px;
        }
        .card-prenotazione {
            max-width: 500px;
            margin: -30px auto 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(60, 40, 20, 0.08);
            padding: 30px;
            border: none;
        }
        .btn-primary {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
            font-weight: 500;
            padding: 12px;
        }
        .btn-primary:hover {
            background-color: #8f5a37;
            border-color: #8f5a37;
        }
        .form-label {
            font-size: 0.85rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control, .form-select {
            padding: 10px 15px;
            border-radius: 8px;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--bs-primary);
            box-shadow: 0 0 0 0.25rem rgba(193, 123, 78, 0.25);
        }
        #messaggio-successo { display: none; text-align: center; }
        .demo-banner {
            background: #ffc107;
            color: #000;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="demo-banner">Modalità Demo: Questa è una pagina di prova del software Comanda</div>

    <div class="header-ristorante">
        <h1>La Tua Pizzeria</h1>
        <p>Prenotazione Tavoli Online</p>
    </div>

    <div class="container px-3">
        <div class="card card-prenotazione">
            
            <form id="form-prenotazione">
                <h4 class="mb-4 text-center" style="font-family: 'Playfair Display', serif; color: #8f5a37;">Riserva il tuo tavolo</h4>
                
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label">Data</label>
                        <input type="date" class="form-control" id="data" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Ora</label>
                        <select class="form-select" id="ora" required>
                            <option value="" disabled selected>Scegli...</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label">Persone</label>
                        <input type="number" class="form-control" id="coperti" min="1" max="20" required value="2">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Area</label>
                        <select class="form-select" id="area" required>
                            <option value="Ristorante">Ristorante</option>
                            <option value="Pizzeria" selected>Pizzeria</option>
                            <option value="Misto">Indifferente</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nome e Cognome</label>
                    <input type="text" class="form-control" id="nome" required placeholder="Mario Rossi">
                </div>

                <div class="mb-3">
                    <label class="form-label">Telefono</label>
                    <input type="tel" class="form-control" id="telefono" required placeholder="333 1234567">
                </div>

                <div class="mb-4">
                    <label class="form-label">Note o Allergie (Opzionale)</label>
                    <textarea class="form-control" id="note" rows="2" placeholder="Es. Seggiolone per bambino, celiachia..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="btn-prenota">Conferma Prenotazione</button>
                
                <div id="errore-msg" class="text-danger text-center mt-3 small" style="display: none;"></div>
            </form>

           <div id="messaggio-successo">
                <div style="font-size: 4rem; line-height: 1;">✅</div>
                <h3 class="mt-3" style="font-family: 'Playfair Display', serif; color: #8f5a37;">Prenotazione Ricevuta!</h3>
                <p class="text-muted mt-2">Grazie <span id="nome-conferma" class="fw-bold"></span>, ti aspettiamo il <span id="data-conferma" class="fw-bold"></span> alle <span id="ora-conferma" class="fw-bold"></span>.</p>
                
                <!-- IL PONTE VERSO LA DASHBOARD -->
                <div class="mt-4">
                    <a href="dashboard.html" class="btn btn-primary w-100 mb-2 py-3" style="font-size: 1.1rem; font-weight: 600; box-shadow: 0 4px 12px rgba(193,123,78,0.3);">
                        Vedi com'è arrivata al Ristorante 👨‍🍳
                    </a>
                    <button class="btn btn-link text-muted mt-2 text-decoration-none" onclick="location.reload()" style="font-size: 0.85rem;">
                        (Oppure fai un'altra prova)
                    </button>
                </div>
            </div>

    <script>
        const API = 'https://ristoranteprova-backend.onrender.com';

        window.addEventListener('DOMContentLoaded', () => {
            const inputData = document.getElementById('data');
            const oggi = new Date().toISOString().split('T')[0];
            inputData.value = oggi;
            inputData.min = oggi;

            popolaOrari();
        });

        async function popolaOrari() {
            const selectOra = document.getElementById('ora');
            
            try {
                const risposta = await fetch(`${API}/orari-validi/`);
                const dati = await risposta.json();
                const orari = dati.orari || [];
                
                const pranzo = orari.filter(o => o < "16:00");
                const cena = orari.filter(o => o >= "16:00");

                function creaOpzioni(lista) {
                    return lista.map(o => `<option value="${o}">${o}</option>`).join('');
                }

                selectOra.innerHTML = `
                    <option value="" disabled selected>Scegli...</option>
                    ${pranzo.length ? `<optgroup label="Pranzo">${creaOpzioni(pranzo)}</optgroup>` : ''}
                    ${cena.length ? `<optgroup label="Cena">${creaOpzioni(cena)}</optgroup>` : ''}
                `;
            } catch (e) {
                selectOra.innerHTML = '<option value="">Errore server</option>';
            }
        }

        document.getElementById('form-prenotazione').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btn-prenota');
            const errBox = document.getElementById('errore-msg');
            btn.disabled = true;
            btn.innerText = 'Invio in corso...';
            errBox.style.display = 'none';

            const dati = {
                nome_cliente: document.getElementById('nome').value,
                telefono: document.getElementById('telefono').value,
                data_prenotazione: document.getElementById('data').value,
                ora_prenotazione: document.getElementById('ora').value,
                numero_persone: parseInt(document.getElementById('coperti').value),
                area: document.getElementById('area').value,
                note: document.getElementById('note').value
            };

            try {
                const risposta = await fetch(`${API}/prenotazioni/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dati)
                });

                if (risposta.ok) {
                    document.getElementById('form-prenotazione').style.display = 'none';
                    document.getElementById('messaggio-successo').style.display = 'block';
                    
                    document.getElementById('nome-conferma').innerText = dati.nome_cliente;
                    const splitData = dati.data_prenotazione.split('-');
                    document.getElementById('data-conferma').innerText = `${splitData[2]}/${splitData[1]}/${splitData[0]}`;
                    document.getElementById('ora-conferma').innerText = dati.ora_prenotazione;
                } else {
                    throw new Error('Errore dal server');
                }
            } catch (error) {
                errBox.innerText = 'Si è verificato un errore durante la prenotazione. Riprova.';
                errBox.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Conferma Prenotazione';
            }
        });
    </script>
</body>
</html>
